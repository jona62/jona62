<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
<title>Body Lab</title>
<meta name="description" content="Touch sandbox for the clock painter's rig: walk, run, jump, pick up and throw, with the balance model exposed." />
<meta name="theme-color" content="#eef0f3" />
<style>
  html, body { height: 100%; margin: 0; background: #eef0f3; color: #1c2029;
    font: 400 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    overscroll-behavior: none; -webkit-user-select: none; user-select: none; }
  body { display: flex; flex-direction: column; }
  #stage { display: block; flex: 1 1 auto; touch-action: none; cursor: crosshair; }
  #bar { flex: 0 0 auto; display: flex; flex-wrap: wrap; gap: 6px; padding: 8px 8px calc(8px + env(safe-area-inset-bottom, 0px));
    background: #fff; border-top: 1px solid #d9dde4; align-items: center; }
  button { flex: 1 1 0; min-width: 74px; min-height: 46px; padding: 0 10px; font: 600 13px/1 inherit;
    letter-spacing: 0.02em; color: #26303f; background: #f2f4f7; border: 1px solid #ccd3dc;
    border-radius: 9px; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  button:active { background: #e3e8ef; transform: translateY(1px); }
  button.on { background: #2f6df0; border-color: #2559c9; color: #fff; }
  #hud { flex: 1 0 100%; order: -1; padding: 2px 2px 6px; color: #5a6475;
    font: 400 11px/1.3 ui-monospace, Menlo, monospace; white-space: pre; overflow-x: auto; }
  .keys { opacity: 0.72; font-size: 11px; }
  #tip { position: absolute; top: calc(10px + env(safe-area-inset-top, 0px)); left: 0; right: 0; text-align: center;
    color: #6d7787; font-size: 12px; pointer-events: none; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <p id="tip">drag anywhere — he reaches for your finger, and walks to it if it is out of reach<br>
    <span class="keys">A D / arrows walk · shift run · space jump · E pick up · F throw · X skeleton · Z slow-mo · R reset</span></p>
  <div id="bar">
    <div id="hud">state —</div>
    <button id="run" type="button">Run</button>
    <button id="jump" type="button">Jump</button>
    <button id="grab" type="button">Pick up</button>
    <button id="throw" type="button">Throw</button>
    <button id="slow" type="button">Slow-mo</button>
    <button id="skel" type="button">Skeleton</button>
    <button id="reset" type="button">Reset</button>
  </div>
  <script src="../js/util.js"></script>
  <script src="../js/rig.js"></script>
  <script src="../js/draw2d.js"></script>
  <script src="../js/figure.js"></script>
  <script src="lab.js"></script>
</body>
</html>
